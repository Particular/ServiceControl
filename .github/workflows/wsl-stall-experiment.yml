# Run Build and Setup WSL together, with image WSL and WSL 2.7.12. The restored-concurrent workload
# restores NuGet packages before Setup WSL starts, so the overlapping build makes no package downloads.
# Resource samples are taken every 15 seconds and uploaded to GitHub about once a minute.
# Timed-out jobs may have no final log; already uploaded snapshots remain available.
# Temporary; delete the branch when the experiment is done.
name: WSL stall experiment
on:
  push:
    branches:
      - wsl-stall-diagnostics
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: true
defaults:
  run:
    shell: pwsh
jobs:
  probe:
    name: ${{ matrix.arm }}-${{ matrix.workload }}-${{ matrix.test-category }}-${{ matrix.iteration }}
    runs-on: windows-latest
    # A healthy job finishes in about six minutes. A stall never finishes, so cap it early.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [ image-wsl, wsl-2.7.12 ]
        workload: [ concurrent, restored-concurrent ]
        test-category: [ SqlServer, PostgreSql, RabbitMQ, IBMMQ ]
        iteration: [ 1, 2, 3, 4, 5, 6, 7, 8 ]
    env:
      DIAGNOSTIC_PREFIX: wsl-${{ github.run_attempt }}-${{ matrix.arm }}-${{ matrix.workload }}-${{ matrix.test-category }}-${{ matrix.iteration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Move NuGet caches to the temp drive
        uses: ./.github/actions/nuget-cache-location
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Determine runtime version
        run: |
          [xml]$xml = Get-Content ./src/Custom.Build.props
          $runtimeVersion = $xml.selectNodes('/Project/PropertyGroup/RuntimeFrameworkVersion').InnerText
          if (-not ($runtimeVersion)) {
            throw "Missing RuntimeFrameworkVersion setting in Custom.Build.props"
          }
          echo "RuntimeVersion=$runtimeVersion" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
      - name: Install .NET Runtime on Windows
        run: |
          ./tools/dotnet-install.ps1 -SkipNonVersionedFiles -InstallDir "C:\Program Files\dotnet" -Runtime dotnet -Version ${{ env.RuntimeVersion }}
          ./tools/dotnet-install.ps1 -SkipNonVersionedFiles -InstallDir "C:\Program Files\dotnet" -Runtime aspnetcore -Version ${{ env.RuntimeVersion }}
          ./tools/dotnet-install.ps1 -SkipNonVersionedFiles -InstallDir "C:\Program Files\dotnet" -Runtime windowsdesktop -Version ${{ env.RuntimeVersion }}
      - name: Select test projects
        run: ./tools/select-test-projects.ps1 -Category ${{ matrix.test-category }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install resource monitor
        run: npm ci --prefix tools/wsl-stall-monitor --no-audit --no-fund
      - name: Runner details
        timeout-minutes: 1
        run: |
          $checkpoint = Join-Path $env:RUNNER_TEMP 'wsl-checkpoint.txt'
          @(
            "utc=$([DateTimeOffset]::UtcNow.ToString('o'))"
            "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          ) | Set-Content -LiteralPath $checkpoint
          (wsl.exe --version) -replace "`0", '' | Where-Object { $_ } | Add-Content -LiteralPath $checkpoint
          Get-Content -LiteralPath $checkpoint | Out-Host
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Get-ItemProperty |
            Where-Object { $_.DisplayName -like 'Windows Subsystem for Linux*' } |
            ForEach-Object { Write-Host "Installed MSI: $($_.DisplayName) $($_.DisplayVersion) $($_.PSChildName)" }
          Get-AppxPackage -AllUsers -Name 'MicrosoftCorporationII.WindowsSubsystemForLinux' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "Installed Appx: $($_.PackageFullName)" }
          $global:LASTEXITCODE = 0
      - name: Save runner details
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.DIAGNOSTIC_PREFIX }}-runner
          path: ${{ runner.temp }}/wsl-checkpoint.txt
          retention-days: 7
      - name: Pin WSL to 2.7.12
        if: matrix.arm == 'wsl-2.7.12'
        run: |
          $target = '2.7.12.0'
          $msi = Join-Path $env:RUNNER_TEMP 'wsl.2.7.12.0.x64.msi'
          curl.exe -fsSL --retry 3 -o $msi 'https://github.com/microsoft/WSL/releases/download/2.7.12/wsl.2.7.12.0.x64.msi'
          if ($LASTEXITCODE -ne 0) { throw "Download failed with curl exit code $LASTEXITCODE" }
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash
          Write-Host "Downloaded $msi ($((Get-Item $msi).Length) bytes, SHA-256 $hash)"

          # The image ships WSL as an MSI. msiexec refuses to downgrade in place, so remove it first.
          $installed = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Get-ItemProperty |
            Where-Object { $_.DisplayName -like 'Windows Subsystem for Linux*' -and $_.PSChildName -match '^\{' }
          foreach ($product in $installed) {
            Write-Host "Uninstalling $($product.DisplayName) $($product.DisplayVersion) ($($product.PSChildName))"
            $p = Start-Process msiexec.exe -ArgumentList "/x $($product.PSChildName) /qn /norestart" -Wait -PassThru
            if ($p.ExitCode -notin 0, 3010, 1605) { throw "Uninstall failed with msiexec exit code $($p.ExitCode)" }
          }
          Get-AppxPackage -AllUsers -Name 'MicrosoftCorporationII.WindowsSubsystemForLinux' -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "Removing Appx $($_.PackageFullName)"
              Remove-AppxPackage -Package $_.PackageFullName -AllUsers -ErrorAction Continue
            }

          Write-Host "Installing WSL $target"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { throw "Install failed with msiexec exit code $($p.ExitCode)" }

          $version = (wsl.exe --version) -replace "`0", '' | Where-Object { $_ }
          $version | Out-Host
          $reported = ($version | Select-String -Pattern 'WSL version:\s*(\S+)').Matches.Groups[1].Value
          if ($reported -ne $target) { throw "Expected WSL $target after pinning, but wsl --version reports '$reported'" }
          "Pinned WSL version: $reported" | Add-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'wsl-checkpoint.txt')
          $global:LASTEXITCODE = 0
      - name: Restore NuGet packages
        if: matrix.workload == 'restored-concurrent'
        timeout-minutes: 5
        run: dotnet restore tests.proj -p:Configuration=Release -p:NuGetAudit=false
      - name: Record start of workload
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          "Ready for $env:WORKLOAD at $([DateTimeOffset]::UtcNow.ToString('o'))" |
            Add-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'wsl-checkpoint.txt')
      - name: Save checkpoint before workload
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.DIAGNOSTIC_PREFIX }}-before-workload
          path: ${{ runner.temp }}/wsl-checkpoint.txt
          retention-days: 7
      - name: Monitor runner resources
        background: true
        continue-on-error: true
        timeout-minutes: 15
        uses: ./tools/wsl-stall-monitor
      - name: Wait for first resource snapshot
        timeout-minutes: 1
        run: |
          $ready = Join-Path $env:RUNNER_TEMP 'wsl-resources/ready'
          $deadline = [DateTimeOffset]::UtcNow.AddSeconds(45)
          while (-not (Test-Path -LiteralPath $ready)) {
            if ([DateTimeOffset]::UtcNow -ge $deadline) {
              throw 'The resource monitor did not upload its first snapshot within 45 seconds.'
            }
            Start-Sleep -Seconds 1
          }
      # Audit failures would remove the build load before the contention starts.
      - name: Build
        id: build
        background: true
        timeout-minutes: 5
        run: dotnet build tests.proj --configuration Release -graph -p:NuGetAudit=false ${{ matrix.workload == 'restored-concurrent' && '--no-restore' || '' }}
      - name: Setup WSL
        id: setup-wsl
        uses: Particular/setup-wsl-action@7e67069143b27e935a5c156d4c5319a7f152f6e8
        timeout-minutes: 5
        with:
          memory: 8GB
          enable-cache: false
      - name: Wait for build
        wait: build
      - name: Stop resource monitor and record step outcomes
        if: always()
        env:
          WSL_OUTCOME: ${{ steps.setup-wsl.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          New-Item -ItemType File -Force -Path (Join-Path $env:RUNNER_TEMP 'wsl-monitor.stop') | Out-Null
          @(
            "utc=$([DateTimeOffset]::UtcNow.ToString('o'))"
            "Setup WSL outcome: $env:WSL_OUTCOME"
            "Build outcome: $env:BUILD_OUTCOME"
          ) | Add-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'wsl-checkpoint.txt')
      - name: Save step outcomes
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.DIAGNOSTIC_PREFIX }}-outcomes
          path: ${{ runner.temp }}/wsl-checkpoint.txt
          retention-days: 7
