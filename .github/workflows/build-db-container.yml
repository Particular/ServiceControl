on:
  workflow_call:
permissions:
  packages: write
jobs:
  db-container:
    runs-on: ubuntu-latest
    name: db-container
    defaults:
      run:
        shell: bash
    steps:
      - name: Check for secrets
        env:
          SECRETS_AVAILABLE: ${{ secrets.SECRETS_AVAILABLE }}
        shell: pwsh
        run: exit $(If ($env:SECRETS_AVAILABLE -eq 'true') { 0 } Else { 1 })
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Run MinVer
        uses: Particular/run-minver-action@v1.0.0
      - name: Validate build version
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: ./.github/actions/validate-version
        with:
          version: ${{ env.MinVerVersion }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Log in to GitHub container registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Docker arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - name: Build images
        env:
          TAG_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || env.MinVerVersion }}
        shell: pwsh
        run: |
          Write-Output "Determining RavenDB versions from Directory.Packages.props file"
          [xml]$packagesFile = Get-Content src/Directory.Packages.props
          $RavenVersion = $packagesFile.selectNodes("//Project/ItemGroup/PackageVersion[@Include='RavenDB.Embedded']").Version
          $Raven6Version = $packagesFile.selectNodes("//Project/PropertyGroup/RavenDB6Version").InnerText

          if (-not $RavenVersion) { throw "Unable to determine RavenDB server version from Directory.Packages.props" }
          if (-not $Raven6Version) { throw "Unable to determine RavenDB 6 server version from Directory.Packages.props" }

          # The RavenDB 6 image uses the ubuntu.22.04 base image because RavenDB does not publish ubuntu.24.04 images for 6.2
          $variants = @(
            @{ Suffix = ""; RavenVersion = $RavenVersion; Os = "ubuntu.24.04" },
            @{ Suffix = "-ravendb6"; RavenVersion = $Raven6Version; Os = "ubuntu.22.04" }
          )

          Write-Output "Determining container variants to build"
          $containers = cat src/ServiceControl.RavenDB/containers.json | ConvertFrom-Json
          foreach ($variant in $variants) {
            $RAVENMAJOR = $variant.RavenVersion.Split('.')[0]
            $containers | ForEach-Object -Process {
              $FULLTAG="${{ env.TAG_NAME }}$($variant.Suffix)-$($_.tag)"
              $BASETAG="$($variant.RavenVersion)-$($variant.Os)-$($_.tag)"
              Write-Output "::group::Building $FULLTAG for architecture $($_.arch) from $BASETAG"
              docker build -t ghcr.io/particular/servicecontrol-ravendb:$FULLTAG --file src/ServiceControl.RavenDB/Dockerfile --build-arg VERSION=${{ env.MinVerVersion }} --build-arg RAVENDBMAJOR=$RAVENMAJOR --build-arg BASETAG=$BASETAG --platform linux/$($_.arch) .
              if ($LASTEXITCODE -ne 0) { throw "Building $FULLTAG failed" }
              Write-Output "::endgroup::"
            }
          }
      - name: List local images
        run: docker images
      - name: Push images to GitHub Container registry
        run: docker image push --all-tags ghcr.io/particular/servicecontrol-ravendb
      - name: Create multi-arch manifest
        env:
          TAG_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || env.MinVerVersion }}
        shell: pwsh
        run: |
          Write-Output "Creating multi-arch manifest creation commands for containers specified in src/ServiceControl.RavenDB/containers.json"
          $containers = cat src/ServiceControl.RavenDB/containers.json | ConvertFrom-Json
          foreach ($suffix in @("", "-ravendb6")) {
            $manifestCreate = "docker buildx imagetools create -t ghcr.io/particular/servicecontrol-ravendb:${{ env.TAG_NAME }}$suffix"
            $containers | ForEach-Object -Process {
              $manifestCreate += " ghcr.io/particular/servicecontrol-ravendb:${{ env.TAG_NAME }}$suffix-$($_.tag)"
            }
            Write-Output "Invoking manifest creation command: > $manifestCreate"
            Invoke-Expression $manifestCreate
            if ($LASTEXITCODE -ne 0) { throw "Creating the manifest for ${{ env.TAG_NAME }}$suffix failed" }
            Write-Output "Multi-arch image should now be on GitHub Container Registry at https://github.com/Particular/ServiceControl/pkgs/container/servicecontrol-ravendb/"
            Write-Output "Inspecting resulting tag ghcr.io/particular/servicecontrol-ravendb:${{ env.TAG_NAME }}$suffix"
            docker buildx imagetools inspect ghcr.io/particular/servicecontrol-ravendb:${{ env.TAG_NAME }}$suffix
          }
