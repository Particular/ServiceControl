# Spike: can we run more categories per OS runner using the new background/wait
# primitives? Windows-only, no cloud categories, no secrets required.
#
# Two jobs, same build, same five category groups (lanes), different scheduling:
#
#   spike-serial : runs the lanes one after another on a single runner
#   spike-lanes  : runs the lanes as `background: true` steps, joined with wait-all
#
# What the run answers:
#   1. Machine minutes: serial >= lanes should collapse if the work is I/O bound.
#   2. 16 GB ceiling: do five acceptance lanes (ServiceControl hosts + RavenDB
#      embedded servers each) fit, or do lanes OOM/swap?
#   3. Ports: lane-multi hosts primary+audit (33333/44444) while lane-raven-main
#      and lane-audit host those same instance types concurrently. Bind failures
#      tell us the acceptance harness uses fixed ports.
#
# Only for the ci_tryout branch. Intentionally not wired into the main matrix.

name: Spike Lanes

on:
  workflow_dispatch:
  push:
    branches:
      - ci_tryout

concurrency:
  group: spike-lanes-${{ github.ref }}
  cancel-in-progress: true

env:
  PARTICULARSOFTWARE_LICENSE: ${{ secrets.LICENSETEXT }}

defaults:
  run:
    shell: pwsh

jobs:
  spike-serial:
    name: Spike Serial (baseline)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Download RavenDB Server
        run: ./tools/download-ravendb-server.ps1
      - name: Build
        run: dotnet build src --configuration Release -graph
      - name: Run lanes sequentially
        run: |
          ./tools/spike-run-lane.ps1 -Name raven-main -Filter PrimaryRavenAcceptance -Projects @(
            'src/ServiceControl.AcceptanceTests.RavenDB/ServiceControl.AcceptanceTests.RavenDB.csproj')
          ./tools/spike-run-lane.ps1 -Name audit -Filter Default -Projects @(
            'src/ServiceControl.Audit.AcceptanceTests/ServiceControl.Audit.AcceptanceTests.csproj',
            'src/ServiceControl.Audit.AcceptanceTests.RavenDB/ServiceControl.Audit.AcceptanceTests.RavenDB.csproj')
          ./tools/spike-run-lane.ps1 -Name multi -Filter Default -Projects @(
            'src/ServiceControl.MultiInstance.AcceptanceTests/ServiceControl.MultiInstance.AcceptanceTests.csproj')
          ./tools/spike-run-lane.ps1 -Name monitor -Filter Default -Projects @(
            'src/ServiceControl.Monitoring.AcceptanceTests/ServiceControl.Monitoring.AcceptanceTests.csproj',
            'src/ServiceControl.Monitoring.UnitTests/ServiceControl.Monitoring.UnitTests.csproj')
          ./tools/spike-run-lane.ps1 -Name unit -Filter Default -Projects @(
            'src/ServiceControl.UnitTests/ServiceControl.UnitTests.csproj',
            'src/ServiceControl.Audit.UnitTests/ServiceControl.Audit.UnitTests.csproj',
            'src/ServiceControl.Config.Tests/ServiceControl.Config.Tests.csproj',
            'src/ServiceControl.Infrastructure.Tests/ServiceControl.Infrastructure.Tests.csproj',
            'src/Particular.LicensingComponent.UnitTests/Particular.LicensingComponent.UnitTests.csproj',
            'src/ServiceControl.Persistence.Tests.InMemory/ServiceControl.Persistence.Tests.InMemory.csproj',
            'src/ServiceControl.Audit.Persistence.Tests/ServiceControl.Audit.Persistence.Tests.csproj',
            'src/ServiceControl.Audit.Persistence.Tests.RavenDB/ServiceControl.Audit.Persistence.Tests.RavenDB.csproj',
            'src/ServiceControlInstaller.Engine.UnitTests/ServiceControlInstaller.Engine.UnitTests.csproj',
            'src/ServiceControlInstaller.Packaging.UnitTests/ServiceControlInstaller.Packaging.UnitTests.csproj',
            'src/ServiceControl.Transports.Tests/ServiceControl.Transports.Tests.csproj')

  spike-lanes:
    name: Spike Lanes (parallel)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Download RavenDB Server
        run: ./tools/download-ravendb-server.ps1
      - name: Build
        run: dotnet build src --configuration Release -graph
      - name: Memory sampler
        id: memory
        run: ./tools/spike-memory.ps1
        background: true
      - name: Lane raven-main (hosts main SC, 33333)
        id: lane-raven-main
        run: ./tools/spike-run-lane.ps1 -Name raven-main -Filter PrimaryRavenAcceptance -Projects @('src/ServiceControl.AcceptanceTests.RavenDB/ServiceControl.AcceptanceTests.RavenDB.csproj')
        background: true
      - name: Lane audit (hosts audit SC, 44444)
        id: lane-audit
        run: ./tools/spike-run-lane.ps1 -Name audit -Filter Default -Projects @('src/ServiceControl.Audit.AcceptanceTests/ServiceControl.Audit.AcceptanceTests.csproj', 'src/ServiceControl.Audit.AcceptanceTests.RavenDB/ServiceControl.Audit.AcceptanceTests.RavenDB.csproj')
        background: true
      - name: Lane multi (hosts primary AND audit)
        id: lane-multi
        run: ./tools/spike-run-lane.ps1 -Name multi -Filter Default -Projects @('src/ServiceControl.MultiInstance.AcceptanceTests/ServiceControl.MultiInstance.AcceptanceTests.csproj')
        background: true
      - name: Lane monitor (hosts monitoring SC, 33633)
        id: lane-monitor
        run: ./tools/spike-run-lane.ps1 -Name monitor -Filter Default -Projects @('src/ServiceControl.Monitoring.AcceptanceTests/ServiceControl.Monitoring.AcceptanceTests.csproj', 'src/ServiceControl.Monitoring.UnitTests/ServiceControl.Monitoring.UnitTests.csproj')
        background: true
      - name: Lane unit (no fixed ports)
        id: lane-unit
        run: ./tools/spike-run-lane.ps1 -Name unit -Filter Default -Projects @('src/ServiceControl.UnitTests/ServiceControl.UnitTests.csproj', 'src/ServiceControl.Audit.UnitTests/ServiceControl.Audit.UnitTests.csproj', 'src/ServiceControl.Config.Tests/ServiceControl.Config.Tests.csproj', 'src/ServiceControl.Infrastructure.Tests/ServiceControl.Infrastructure.Tests.csproj', 'src/Particular.LicensingComponent.UnitTests/Particular.LicensingComponent.UnitTests.csproj', 'src/ServiceControl.Persistence.Tests.InMemory/ServiceControl.Persistence.Tests.InMemory.csproj', 'src/ServiceControl.Audit.Persistence.Tests/ServiceControl.Audit.Persistence.Tests.csproj', 'src/ServiceControl.Audit.Persistence.Tests.RavenDB/ServiceControl.Audit.Persistence.Tests.RavenDB.csproj', 'src/ServiceControlInstaller.Engine.UnitTests/ServiceControlInstaller.Engine.UnitTests.csproj', 'src/ServiceControlInstaller.Packaging.UnitTests/ServiceControlInstaller.Packaging.UnitTests.csproj', 'src/ServiceControl.Transports.Tests/ServiceControl.Transports.Tests.csproj')
        background: true
      - name: Wait for lanes
        wait-all:
      - name: Memory summary
        if: always()
        run: |
          Get-Content -Path .\spike-memory.csv -ErrorAction SilentlyContinue | Select-Object -First 3
          Get-Content -Path .\spike-memory.csv -ErrorAction SilentlyContinue | Select-Object -Last 10