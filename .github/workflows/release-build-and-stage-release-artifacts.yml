name: Build And Stage Release Artifacts
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
env:
  DOTNET_NOLOGO: true
jobs:
  windows-installers:
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
  containers:
    uses: ./.github/workflows/build-containers.yml
    secrets: inherit
  db-container:
    uses: ./.github/workflows/build-db-container.yml
    secrets: inherit
  cloud-tests:
    uses: ./.github/workflows/cloud-database-tests.yml
    secrets: inherit
  stage-artifacts:
    needs: [windows-installers, containers, db-container]
    permissions:
      contents: write
    uses: ./.github/workflows/release-deploy-to-staging.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
