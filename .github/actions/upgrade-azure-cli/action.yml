name: Upgrade Azure CLI
description: Upgrades Azure CLI on Linux and Windows runners
runs:
  using: composite
  steps:
    - name: Upgrade Azure CLI on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: curl -fsSL 'https://azurecliprod.blob.core.windows.net/$root/deb_install.sh' | sudo bash
    - name: Upgrade Azure CLI on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: az upgrade --yes
