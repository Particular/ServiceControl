<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ServiceControl Testing Tool</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface-2: #0f3460;
      --accent: #e94560;
      --accent-2: #0f3460;
      --text: #eee;
      --muted: #888;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
      --border: #2a2a4a;
      --radius: 8px;
    }

    [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #fff;
      --surface-2: #e8eaf0;
      --accent: #e94560;
      --accent-2: #3b82f6;
      --text: #1a1a2e;
      --muted: #666;
      --border: #ddd;
    }

    * { box-sizing: border-box; }
    body { font: 14px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
    a { color: var(--accent-2); }

    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.5rem; margin: 0; }
    header .theme-toggle { cursor: pointer; font-size: 1.2rem; border: none; background: none; color: var(--text); }

    /* --- Status bar --- */
    .status-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: .75rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .9rem 1rem;
    }
    .stat-card .label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; margin-top: .2rem; }
    .stat-card .sub { font-size: .75rem; color: var(--muted); margin-top: .1rem; }
    .stat-card.accent { border-left: 3px solid var(--accent); }

    /* --- Connection info --- */
    .info-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .6rem 1rem;
      margin-bottom: 1.5rem;
      font-size: .85rem;
    }
    .info-bar .item { display: flex; align-items: center; gap: .4rem; }
    .info-bar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.on { background: var(--ok); } .dot.off { background: var(--muted); }
    .info-bar .spacer { flex: 1; }

    /* --- Scenarios --- */
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
    .section-head h2 { font-size: 1.2rem; margin: 0; }
    .btn { padding: .4rem .9rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: .85rem; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.start { border-color: var(--ok); color: var(--ok); }
    .btn.stop { border-color: var(--err); color: var(--err); }
    .btn.danger { border-color: var(--accent); color: var(--accent); }

    .scenarios { display: grid; gap: .75rem; }
    .scenario-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      transition: border-color .2s;
    }
    .scenario-card.running { border-left: 3px solid var(--ok); }
    .scenario-card .header-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .scenario-card .name { font-weight: 700; font-size: 1.05rem; }
    .scenario-card .cat {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
      background: var(--surface-2); padding: .15rem .5rem; border-radius: 4px; color: var(--muted);
    }
    .scenario-card .desc { color: var(--muted); font-size: .85rem; margin-top: .3rem; }
    .scenario-card .controls { display: flex; align-items: center; gap: .5rem; margin-top: .8rem; flex-wrap: wrap; }
    .scenario-card input[type="number"] {
      width: 80px; padding: .3rem .5rem; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); color: var(--text); font-size: .85rem;
    }
    .scenario-card input[type="text"] {
      width: 70px; padding: .3rem .5rem; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); color: var(--text); font-size: .85rem;
    }
    .scenario-card .field-label { font-size: .75rem; color: var(--muted); }
    .scenario-card .stats { display: flex; gap: 1.2rem; margin-top: .6rem; font-size: .8rem; color: var(--muted); }
    .scenario-card .stats span strong { color: var(--text); }

    .badge { font-size: .7rem; padding: .1rem .45rem; border-radius: 4px; font-weight: 600; }
    .badge.running { background: var(--ok); color: #111; }
    .badge.idle { background: var(--surface-2); color: var(--muted); }

    .loading { text-align: center; padding: 2rem; color: var(--muted); }

    /* --- Toast --- */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 100;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .8rem 1.2rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
      opacity: 0; transform: translateY(10px); transition: all .2s;
      pointer-events: none; max-width: 380px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { border-color: var(--err); }
    #toast.ok { border-color: var(--ok); }

    footer { margin-top: 2rem; color: var(--muted); font-size: .75rem; text-align: center; }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>🎯 ServiceControl Testing Tool</h1>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    </header>

    <!-- Status dashboard -->
    <div class="status-bar" id="status-bar">
      <div class="stat-card accent">
        <div class="label">Errors Sent</div>
        <div class="value" id="stat-errors">—</div>
        <div class="sub" id="stat-rate">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Errors Replayed</div>
        <div class="value" id="stat-replayed">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Searches</div>
        <div class="value" id="stat-searches">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Active Scenarios</div>
        <div class="value" id="stat-active">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Uptime</div>
        <div class="value" id="stat-uptime">—</div>
      </div>
    </div>

    <!-- Connection info -->
    <div class="info-bar" id="info-bar">
      <span class="loading">Loading…</span>
    </div>

    <!-- Scenarios -->
    <div class="section-head">
      <h2>Scenarios</h2>
      <button class="btn danger" onclick="stopAll()" id="btn-stop-all" disabled>Stop All</button>
    </div>
    <div class="scenarios" id="scenarios">
      <div class="loading">Loading scenarios…</div>
    </div>

    <footer>
      <a href="/metrics" target="_blank">Prometheus /metrics</a>
      &nbsp;·&nbsp; OTel OTLP export active
      &nbsp;·&nbsp; <span id="footer-shard">shard: —</span>
    </footer>
  </div>

  <div id="toast"></div>

  <script>
    // --- State ---
    let scenarios = [];
    let status = null;
    let refreshTimer = null;

    // --- Theme ---
    function toggleTheme() {
      const dark = document.documentElement.getAttribute('data-theme') !== 'light';
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
      document.querySelector('.theme-toggle').textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('tt-theme', dark ? 'light' : 'dark');
    }
    (function() {
      const saved = localStorage.getItem('tt-theme');
      if (saved === 'light') { document.documentElement.setAttribute('data-theme', 'light'); document.querySelector('.theme-toggle').textContent = '☀️'; }
    })();

    // --- Toast ---
    let toastTimer = null;
    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = '', 3000);
    }

    // --- Formatting ---
    function fmtNum(n) { return n?.toLocaleString?.() ?? '—'; }
    function fmtUptime(ts) {
      if (!ts) return '—';
      // Uptime comes pre-formatted from the server (e.g. "0h 5m 12s")
      return ts;
    }

    // --- API calls ---
    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || res.statusText);
      }
      return res.json();
    }

    // --- Load status ---
    async function loadStatus() {
      try {
        status = await api('GET', '/api/status');
        document.getElementById('stat-errors').textContent = fmtNum(status.errorsSent);
        document.getElementById('stat-rate').textContent = `${status.currentRate ?? 0} msg/s`;
        document.getElementById('stat-replayed').textContent = fmtNum(status.errorsReplayed);
        document.getElementById('stat-searches').textContent = fmtNum(status.searchesExecuted);
        document.getElementById('stat-active').textContent = status.activeScenarios ?? 0;
        document.getElementById('stat-uptime').textContent = fmtUptime(status.uptime);

        // Info bar
        const replayDot = status.replayEnabled ? 'on' : 'off';
        const searchDot = status.searchEnabled ? 'on' : 'off';
        document.getElementById('info-bar').innerHTML = `
          <span class="item"><span class="dot on"></span> Ready</span>
          <span class="item"><span class="dot ${replayDot}"></span> Replay: ${status.replayEnabled ? 'enabled' : 'disabled'}</span>
          <span class="item"><span class="dot ${searchDot}"></span> Search: ${status.searchEnabled ? 'enabled' : 'disabled'}</span>
          <span class="spacer"></span>
          <span class="item">SC: <a href="${status.serviceControlUrl}" target="_blank">${status.serviceControlUrl ?? '—'}</a></span>
          <span class="item">shard: <strong>${status.shardId ?? '—'}</strong></span>
        `;
        document.getElementById('footer-shard').textContent = `shard: ${status.shardId ?? '—'}`;
      } catch (e) {
        document.getElementById('info-bar').innerHTML = `<span class="item" style="color:var(--err)">⚠ ${e.message}</span>`;
      }
    }

    // --- Load scenarios ---
    async function loadScenarios() {
      try {
        scenarios = await api('GET', '/api/scenarios');
        renderScenarios();
      } catch (e) {
        document.getElementById('scenarios').innerHTML = `<div class="loading" style="color:var(--err)">⚠ ${e.message}</div>`;
      }
    }

    function renderScenarios() {
      const hasRunning = scenarios.some(s => s.running);
      document.getElementById('btn-stop-all').disabled = !hasRunning;

      if (scenarios.length === 0) {
        document.getElementById('scenarios').innerHTML = '<div class="loading">No scenarios registered.</div>';
        return;
      }

      // Group by category
      const categories = {};
      scenarios.forEach(s => {
        (categories[s.category] ??= []).push(s);
      });

      let html = '';
      for (const [cat, items] of Object.entries(categories).sort()) {
        html += `<div style="margin-bottom:.5rem;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">${cat}</div>`;
        for (const s of items) {
          html += renderScenarioCard(s);
        }
      }
      document.getElementById('scenarios').innerHTML = html;
    }

    function renderScenarioCard(s) {
      const rateId = `rate-${s.name}`;
      const durId = `dur-${s.name}`;
      return `
        <div class="scenario-card ${s.running ? 'running' : ''}" data-scenario="${s.name}">
          <div class="header-row">
            <div>
              <span class="name">${s.name}</span>
              <span class="badge ${s.running ? 'running' : 'idle'}">${s.running ? 'running' : 'idle'}</span>
              &nbsp;<span class="cat">${s.category}</span>
            </div>
            <div>
              <button class="btn start" onclick="startScenario('${s.name}')" ${s.running ? 'disabled' : ''}>▶ Start</button>
              <button class="btn stop" onclick="stopScenario('${s.name}')" ${s.running ? '' : 'disabled'}>⏹ Stop</button>
            </div>
          </div>
          <div class="desc">${s.description}</div>
          <div class="controls">
            <span class="field-label">Rate (msg/s):</span>
            <input type="number" id="${rateId}" value="${s.defaultRate}" min="1" step="1" ${s.running ? 'disabled' : ''} />
            <span class="field-label">Duration (sec, optional):</span>
            <input type="number" id="${durId}" value="" min="1" step="1" placeholder="∞" ${s.running ? 'disabled' : ''} />
          </div>
          <div class="stats">
            <span>Errors sent: <strong>${fmtNum(s.errorsSent)}</strong></span>
            <span>Rate: <strong>${s.currentRate ?? 0} msg/s</strong></span>
            ${s.cooldown ? `<span>Cooldown: <strong>${s.cooldown}</strong></span>` : ''}
          </div>
        </div>`;
    }

    // --- Actions ---
    async function startScenario(name) {
      const rateVal = parseFloat(document.getElementById(`rate-${name}`)?.value);
      const durVal = parseInt(document.getElementById(`dur-${name}`)?.value);
      const body = {};
      if (rateVal && rateVal > 0) body.rate = rateVal;
      if (durVal && durVal > 0) body.durationSeconds = durVal; // seconds

      try {
        await api('POST', `/api/scenarios/${encodeURIComponent(name)}/start`, body);
        toast(`Started "${name}"`, 'ok');
        await loadScenarios();
      } catch (e) {
        toast(`Failed to start: ${e.message}`, 'error');
      }
    }

    async function stopScenario(name) {
      try {
        await api('POST', `/api/scenarios/${encodeURIComponent(name)}/stop`);
        toast(`Stopped "${name}"`, 'ok');
        await loadScenarios();
      } catch (e) {
        toast(`Failed to stop: ${e.message}`, 'error');
      }
    }

    async function stopAll() {
      try {
        await api('POST', '/api/scenarios/stop-all');
        toast('Stopped all scenarios', 'ok');
        await loadScenarios();
      } catch (e) {
        toast(`Failed: ${e.message}`, 'error');
      }
    }

    // --- Polling ---
    async function loadAll() {
      await Promise.all([loadStatus(), loadScenarios()]);
    }

    async function refresh() {
      // Lightweight status refresh without full scenario re-render (preserves input focus)
      try {
        status = await api('GET', '/api/status');
        document.getElementById('stat-errors').textContent = fmtNum(status.errorsSent);
        document.getElementById('stat-rate').textContent = `${status.currentRate ?? 0} msg/s`;
        document.getElementById('stat-replayed').textContent = fmtNum(status.errorsReplayed);
        document.getElementById('stat-searches').textContent = fmtNum(status.searchesExecuted);
        document.getElementById('stat-active').textContent = status.activeScenarios ?? 0;
        document.getElementById('stat-uptime').textContent = fmtUptime(status.uptime);

        // Update per-scenario stats in-place without re-rendering inputs
        scenarios = await api('GET', '/api/scenarios');
        scenarios.forEach(s => {
          const card = document.querySelector(`[data-scenario="${s.name}"]`);
          if (!card) return;
          const badge = card.querySelector('.badge');
          badge.className = `badge ${s.running ? 'running' : 'idle'}`;
          badge.textContent = s.running ? 'running' : 'idle';
          card.classList.toggle('running', s.running);
          const stats = card.querySelector('.stats');
          if (stats) {
            stats.innerHTML = `
              <span>Errors sent: <strong>${fmtNum(s.errorsSent)}</strong></span>
              <span>Rate: <strong>${s.currentRate ?? 0} msg/s</strong></span>
              ${s.cooldown ? `<span>Cooldown: <strong>${s.cooldown}</strong></span>` : ''}
            `;
          }
          // Enable/disable buttons
          card.querySelector('.btn.start').disabled = s.running;
          card.querySelector('.btn.stop').disabled = !s.running;
          card.querySelectorAll('input').forEach(i => i.disabled = s.running);
        });
        document.getElementById('btn-stop-all').disabled = !scenarios.some(s => s.running);
      } catch (e) {
        // ignore transient errors during polling
      }
    }

    // --- Init ---
    loadAll();
    refreshTimer = setInterval(refresh, 2000);
  </script>
</body>

</html>
